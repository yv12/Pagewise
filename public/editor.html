<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor - Pagewise</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="editor-topbar">
    <div class="editor-nav-row">
      <div style="display: flex; align-items: center; gap: 0.5rem; flex: 1; min-width: 200px;">
        <a id="backLink" href="#" class="button secondary" style="font-size: 0.8rem; padding: 0.35rem 0.6rem;">&larr; Documents</a>
        <input type="text" id="docTitle" class="editor-title-input" placeholder="Untitled" maxlength="200">
      </div>
      <div class="editor-actions">
        <span id="saveStatus" class="editor-status">Loading...</span>
        <span class="share-note">Anyone with the link can read it.</span>
        <button type="button" id="copyShareBtn" class="button secondary" style="font-size: 0.8rem; padding: 0.35rem 0.6rem;">Copy share link</button>
        <button type="button" id="downloadPdfBtn" class="button secondary" title="Choose Save as PDF" style="font-size: 0.8rem; padding: 0.35rem 0.6rem;">Download PDF</button>
      </div>
    </div>
    <div id="printHint" class="print-hint no-print" style="display: none;"></div>

    <div class="editor-toolbar">
      <button type="button" data-cmd="bold" title="Bold"><b>B</b></button>
      <button type="button" data-cmd="italic" title="Italic"><i>I</i></button>
      <button type="button" data-cmd="underline" title="Underline"><u>U</u></button>
      <div class="separator"></div>
      <button type="button" data-format="h1" title="Heading 1"><b>H1</b></button>
      <button type="button" data-format="h2" title="Heading 2"><b>H2</b></button>
      <button type="button" data-format="h3" title="Heading 3"><b>H3</b></button>
      <button type="button" data-format="p" title="Paragraph">¶</button>
      <div class="separator"></div>
      <button type="button" data-cmd="insertUnorderedList" title="Bullet list">&bull; List</button>
      <button type="button" data-cmd="insertOrderedList" title="Numbered list">1. List</button>
      <div class="separator"></div>
      <button type="button" data-cmd="createLink" title="Link">Link</button>
      <div class="separator"></div>
      <button type="button" data-cmd="justifyLeft" title="Align left">&larr;</button>
      <button type="button" data-cmd="justifyCenter" title="Align center">&harr;</button>
      <button type="button" data-cmd="justifyRight" title="Align right">&rarr;</button>
      <div class="separator"></div>
      <button type="button" data-cmd="undo" title="Undo">&#8630;</button>
      <button type="button" data-cmd="redo" title="Redo">&#8631;</button>
    </div>
  </div>

  <div class="container">
    <div id="pdfNoticeBanner" class="notice-banner" style="display: none;"></div>
    <div id="conflictBanner" class="conflict-banner" style="display: none;">
      <span><strong>Document changed elsewhere!</strong> Another user or Claude updated this document.</span>
      <div style="display: flex; gap: 0.5rem;">
        <button id="reloadLatestBtn" class="secondary" style="font-size: 0.8rem; padding: 0.35rem 0.6rem;">Load latest</button>
        <button id="overwriteBtn" class="danger" style="font-size: 0.8rem; padding: 0.35rem 0.6rem;">Keep mine and save</button>
      </div>
    </div>

    <div class="page-container">
      <div id="editor" class="page-sheet" contenteditable="true" spellcheck="true"></div>
    </div>
  </div>

  <script type="module" src="/js/editor.js"></script>
</body>
</html>
